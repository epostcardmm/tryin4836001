<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive ePostcard & Quest Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #ffeef8, #d6eaff); overflow-x: hidden; position: relative; padding: 20px 0; }
        
        .bg-heart { position: absolute; color: rgba(255, 105, 180, 0.2); font-size: 20px; animation: floatUp 6s linear infinite; bottom: -20px; z-index: 0; pointer-events: none; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; } }
        
        .card-container { position: relative; width: 92%; max-width: 480px; background: rgba(255, 255, 255, 0.95); border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 25px; text-align: center; z-index: 10; margin: auto; }
        
        /* Editor Styles */
        .editor-container { max-width: 650px; text-align: left; max-height: 90vh; overflow-y: auto; }
        .editor-container h2 { color: #00bab7; margin-bottom: 15px; text-align: center; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: #444; margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; }
        .step-box { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 12px; padding: 15px; margin-bottom: 12px; position: relative; }
        .step-box h4 { color: #ff4757; margin-bottom: 10px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .delete-step-btn { background: #ff4757; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; }
        
        .btn-main { background: #00bab7; color: white; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; padding: 12px 25px; font-size: 15px; transition: 0.2s; width: 100%; }
        .btn-main:hover { opacity: 0.9; }
        .btn-secondary { background: #ff4757; color: white; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; padding: 10px 20px; font-size: 14px; margin-top: 10px; width: 100%; }

        /* Preview Card Styles */
        .gif-container { width: 140px; height: 140px; margin: 15px auto; }
        .gif-container img { width: 100%; height: 100%; border-radius: 15px; object-fit: cover; }
        .btn-group { position: relative; min-height: 70px; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
        button.choice-btn { padding: 12px 25px; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; transition: 0.2s ease; font-size: 16px; }
        
        .primary-btn, .secondary-btn { background: #00bab7; color: white; }
        .fullscreen-active { position: fixed !important; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; border-radius: 0; font-size: 26px; display: flex; justify-content: center; align-items: center; }
        
        #captureArea { background: linear-gradient(135deg, #fff, #fff0f5); border: 2px dashed #85ff75; border-radius: 18px; padding: 15px; text-align: center; }
        #captureArea h3 { color: #ff4757; margin-bottom: 12px; font-size: 18px; }
        .result-item { background: #ffffff; border: 1px solid #cfffcc; border-radius: 12px; padding: 10px 12px; margin: 8px 0; display: flex; flex-direction: column; align-items: flex-start; text-align: left; box-shadow: 0 3px 8px rgba(255, 117, 140, 0.08); gap: 4px; }
        .result-row { display: flex; justify-content: space-between; width: 100%; align-items: center; }
        .result-q { font-size: 13px; color: #444; flex: 1; padding-right: 8px; font-weight: 500; }
        .result-a { background: #00bab7; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .result-no-count { font-size: 11px; color: #ff4757; font-weight: bold; }
        
        #sendingStatus { display: none; font-size: 14px; color: #6c5ce7; margin-top: 10px; font-weight: bold; }
        
        .heart-start-btn { cursor: pointer; animation: pulseBeat 1.2s infinite; margin: 15px auto; display: inline-block; user-select: none; }
        .heart-start-btn img { width: 130px; height: auto; display: block; border: none; outline: none; background: transparent; }
        @keyframes pulseBeat { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .burst-emoji { position: fixed; font-size: 26px; pointer-events: none; z-index: 99999; animation: burstAnim 0.8s ease-out forwards; }
        @keyframes burstAnim { 0% { transform: translate(0, 0) scale(0.4); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; } }

        .running-gif-container { position: fixed; bottom: 5px; left: 0; width: 100px; height: 100px; z-index: 100; pointer-events: none; animation: runBackAndForth 12s linear infinite; }
        .running-gif-container img { width: 100%; height: 100%; object-fit: contain; background: transparent; animation: faceDirection 12s linear infinite; }
        .speech-bubble { position: absolute; top: -32px; left: 50%; transform: translateX(-50%); background: white; color: #13b11e; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; white-space: nowrap; box-shadow: 0 3px 8px rgba(0,0,0,0.18); border: 1px solid #ffccd5; }
        .speech-bubble::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); border-width: 5px 5px 0; border-style: solid; border-color: white transparent; display: block; width: 0; }

        @keyframes runBackAndForth { 0% { left: 0%; } 49.9% { left: calc(100% - 100px); } 50% { left: calc(100% - 100px); } 100% { left: 0%; } }
        @keyframes faceDirection { 0% { transform: scaleX(1); } 49.9% { transform: scaleX(1); } 50% { transform: scaleX(-1); } 100% { transform: scaleX(-1); } }
    </style>
</head>
<body>

    <div id="heartsContainer"></div>

    <!-- Running Cat Helper -->
    <div class="running-gif-container" id="runningCatWrapper">
        <div class="speech-bubble" id="speechBubbleText">မထားခဲ့ပါနဲ့ 🥺</div>
        <img src="https://media.tenor.com/EjjrPtO6BzQAAAAi/peach-cat.gif" alt="Running GIF">
    </div>

    <!-- 1. EDITOR VIEW (အသေးစိတ်ပြင်ဆင်ရန် နေရာ) -->
    <div class="card-container editor-container" id="editorView">
        <h2>🛠️ ePostcard & Quest Studio</h2>
        
        <div class="form-group">
            <label>Formspree Endpoint URL (အဖြေများ လက်ခံလိုပါက ထည့်ပါ):</label>
            <input type="text" id="inputFormspree" placeholder="https://formspree.io/f/your_id">
        </div>

        <div class="form-group">
            <label>သတိပေးစာသားများ (Comma ဖြင့် ခြားပါ):</label>
            <textarea id="inputWarnings" rows="3">နောက်တစ်ခါ ထပ်နှိပ်ရင် ငိုမှာနော်! 😭, မရဘူး၊ ပြန်စဉ်းစားလိုက်ဦး! 😤, ငြင်းလို့မရဘူးလေ🏃‍♂️, ရက်စက်လိုက်တာကွာ... 😢, လက်ခံလိုက်ပါတော့❤️</textarea>
        </div>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;">
        
        <h3 style="font-size: 16px; color: #444; margin-bottom: 10px;">📋 မေးခွန်း အဆင့်များ (Steps)</h3>
        <div id="stepsEditorList"></div>

        <button class="btn-secondary" type="button" onclick="addNewStep()">➕ မေးခွန်းအသစ် ထပ်ထည့်ရန်</button>
        <br><br>
        <button class="btn-main" onclick="startPreview()">▶️ Preview ကြည့်မည် & စတင်မည်</button>
    </div>

    <!-- 2. INTRO SCREEN -->
    <div class="card-container" id="introScreen" style="display: none;">
        <h2 style="color: #ff4757; margin-bottom: 10px;" id="introTitleText">Hello ရည်းစားဟောင်းလေး</h2>
        <p style="color: #555; font-size: 14px; margin-bottom: 5px;">Click The Heart</p>
        <div class="heart-start-btn" id="startHeartBtn">
            <img src="https://media.tenor.com/RjFzdxaLVNMAAAAi/heart.gif" alt="Heart GIF">
        </div>
        <button class="btn-secondary" style="margin-top: 15px; background: #6c5ce7;" onclick="backToEditor()">⚙️ ပြန်ပြင်မည် (Editor သို့)</button>
    </div>

    <!-- 3. MAIN CARD QUESTION FLOW -->
    <div class="card-container" id="mainCard" style="display: none;">
        <h2 id="questionText">ပြန်ချစ်ကြည့်ကြမလား?</h2>
        <div class="gif-container"><img id="statusGif" src="https://media1.tenor.com/m/2K0bjyLKldkAAAAC/dudu-dudu-bubu.gif"></div>
        <div class="btn-group" id="btnGroup">
            <button id="yesBtn" class="choice-btn primary-btn" onclick="handleInteraction(true)">ချစ်တယ်</button>
            <button id="noBtn" class="choice-btn secondary-btn" onclick="handleInteraction(false)">မချစ်ဘူး</button>
        </div>
        <div id="sendingStatus">အဖြေများကို ပို့ပေးနေပါသည်... 💌</div>
    </div>

    <!-- 4. SUCCESS SCREEN -->
    <div class="card-container" id="successScreen" style="display: none;">
        <div id="captureArea">
            <h3>💖 Our Love Agreement</h3>
            <div id="summaryList"></div>
        </div>
        <button class="primary-btn" style="width:100%; margin-top:15px;" onclick="saveToPNG()">Save As PNG 📸</button>
        <button class="btn-secondary" style="background: #6c5ce7; margin-top: 10px;" onclick="backToEditor()">⚙️ အစကနေ ပြန်ပြင်မည်</button>
    </div>

    <script>
        // မူလ default steps များ
        let defaultSteps = [
            { question: "ပြန်ချစ်ကြည့်ကြမလား?", yes: "ချစ်တယ်", no: "မချစ်ဘူး", gif: "https://media1.tenor.com/m/2K0bjyLKldkAAAAC/dudu-dudu-bubu.gif", type: "shrink" },
            { question: "သတိရနေခဲ့တာ သိရဲ့လား", yes: "ဒီကရောပဲ", no: "မယုံပါဘူး", gif: "https://media.tenor.com/PkvpJyo2rSQAAAAi/bubu-dudu-sseeyall.gif", type: "run" },
            { question: "ပြန်တွဲကြမယ်လေနော် နော်..", yes: "တွဲကြမယ်", no: "တော်ပါပြီ", gif: "https://media.tenor.com/BKP6erkQWjMAAAAi/bubu-dudu-sseeyall.gif", type: "fade" },
            { question: "ပြန်လာမယ်မလား", yes: "ပြန်လာမယ်", no: "မလာပါဘူး", gif: "https://media.tenor.com/BL6TlnbQD0sAAAAi/dudu-surprise.gif", type: "fullscreen" },
            { question: "ဒါဆို ရည်းစားပြန်ဖြစ်ပြီနော်..ဟဲဟဲ", yes: "Yes,Of Course", no: "No..No..No", gif: "https://media1.tenor.com/m/c8KXOOGytDYAAAAC/dudu-dudu-bubu.gif", type: "magnet" }
        ];

        let activeSteps = JSON.parse(JSON.stringify(defaultSteps));
        let warningMessages = [];
        let FORMSPREE_URL = "";

        let currentStep = 0, yesScale = 1, noScale = 1, userAnswers = [];
        let noClickCounts = [];

        // Editor တွင် steps များကို ဖော်ပြရန်
        function renderEditorSteps() {
            const container = document.getElementById('stepsEditorList');
            container.innerHTML = "";
            activeSteps.forEach((s, index) => {
                let div = document.createElement('div');
                div.className = 'step-box';
                div.innerHTML = `
                    <h4>အဆင့် ${index + 1} <button class="delete-step-btn" onclick="removeStep(${index})">ဖျက်မည်</button></h4>
                    <div class="form-group" style="margin-bottom:8px;">
                        <label>မေးခွန်း:</label>
                        <input type="text" value="${s.question}" id="eq_${index}">
                    </div>
                    <div style="display: flex; gap: 8px; margin-bottom:8px;">
                        <div style="flex:1;"><label>Yes ခလုတ်စာသား:</label><input type="text" value="${s.yes}" id="eyes_${index}"></div>
                        <div style="flex:1;"><label>No ခလုတ်စာသား:</label><input type="text" value="${s.no}" id="eno_${index}"></div>
                    </div>
                    <div class="form-group" style="margin-bottom:8px;">
                        <label>GIF ပုံ URL:</label>
                        <input type="text" value="${s.gif}" id="egif_${index}">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>No ခလုတ်ပုံစံ (Animation Type):</label>
                        <select id="etype_${index}">
                            <option value="shrink" ${s.type==='shrink'?'selected':''}>shrink (No ငြင်းလေ Yes ကြီးလာလေ)</option>
                            <option value="run" ${s.type==='run'?'selected':''}>run (No ခလုတ် ပြေးထွက်သွားမည်)</option>
                            <option value="fade" ${s.type==='fade'='/'?'selected':''}>fade (No ခလုတ် ပျောက်သွားမည်)</option>
                            <option value="fullscreen" ${s.type==='fullscreen'?'selected':''}>fullscreen (Yes ခလုတ် မျက်နှာပြင်ပြည့်ဖြစ်မည်)</option>
                            <option value="magnet" ${s.type==='magnet'?'selected':''}>magnet (No နှိပ်ချင်းဖြင့် Yes အလိုအလျောက်ဖြစ်မည်)</option>
                        </select>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function addNewStep() {
            activeSteps.push({ question: "ထပ်တိုးမေးခွန်း?", yes: "သဘောတူတယ်", no: "မလုပ်ဘူး", gif: "https://media1.tenor.com/m/2K0bjyLKldkAAAAC/dudu-dudu-bubu.gif", type: "shrink" });
            renderEditorSteps();
        }

        function removeStep(index) {
            if(activeSteps.length <= 1) {
                alert("မေးခွန်း အနည်းဆုံး တစ်ခုတော့ ရှိရပါမည်။");
                return;
            }
            activeSteps.splice(index, 1);
            renderEditorSteps();
        }

        function startPreview() {
            // Formspree URL & Warnings သိမ်းဆည်းခြင်း
            FORMSPREE_URL = document.getElementById('inputFormspree').value.trim();
            let rawWarnings = document.getElementById('inputWarnings').value;
            warningMessages = rawWarnings.split(',').map(w => w.trim()).filter(w => w.length > 0);
            if(warningMessages.length === 0) warningMessages = ["မရဘူး၊ ပြန်စဉ်းစားလိုက်ဦး! 😤"];

            // Steps များကို Form မှ ပြန်ဖတ်သိမ်းမည်
            for(let i=0; i<activeSteps.length; i++) {
                activeSteps[i].question = document.getElementById(`eq_${i}`).value;
                activeSteps[i].yes = document.getElementById(`eyes_${i}`).value;
                activeSteps[i].no = document.getElementById(`eno_${i}`).value;
                activeSteps[i].gif = document.getElementById(`egif_${i}`).value;
                activeSteps[i].type = document.getElementById(`etype_${i}`).value;
            }

            noClickCounts = new Array(activeSteps.length).fill(0);
            currentStep = 0;
            userAnswers = [];
            yesScale = 1;
            noScale = 1;

            // UI ပြောင်းလဲခြင်း
            document.getElementById('editorView').style.display = 'none';
            document.getElementById('introScreen').style.display = 'block';
        }

        function backToEditor() {
            document.getElementById('editorView').style.display = 'block';
            document.getElementById('introScreen').style.display = 'none';
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('successScreen').style.display = 'none';
            document.getElementById('btnGroup').style.display = 'flex';
            document.getElementById('sendingStatus').style.display = 'none';
        }

        // Warning Bubble ပြောင်းရန်
        function changeWarningBubble() {
            const bubble = document.getElementById('speechBubbleText');
            const randomMsg = warningMessages[Math.floor(Math.random() * warningMessages.length)];
            bubble.innerText = randomMsg;
        }

        document.getElementById('startHeartBtn').onclick = function(e) {
            const rect = this.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            const emojis = ['❤️', '💖', '💕', '💘', '💓', '💗', '💞'];
            
            for (let i = 0; i < 22; i++) {
                let emojiEl = document.createElement('div');
                emojiEl.className = 'burst-emoji';
                emojiEl.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                let angle = Math.random() * Math.PI * 2;
                let distance = 70 + Math.random() * 110;
                emojiEl.style.left = `${x}px`;
                emojiEl.style.top = `${y}px`;
                emojiEl.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                emojiEl.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                document.body.appendChild(emojiEl);
                setTimeout(() => emojiEl.remove(), 800);
            }

            setTimeout(() => {
                document.getElementById('introScreen').style.display = 'none';
                document.getElementById('mainCard').style.display = 'block';
                updateCard();
            }, 350);
        };

        function handleInteraction(isYes) {
            nextStep(isYes);
        }

        function nextStep(isYes) {
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.classList.remove('fullscreen-active');
            
            userAnswers.push({ 
                q: activeSteps[currentStep].question, 
                a: isYes ? activeSteps[currentStep].yes : activeSteps[currentStep].no,
                noCount: noClickCounts[currentStep] 
            });
            
            currentStep++;
            if (currentStep < activeSteps.length) {
                updateCard();
            } else {
                sendAnswersToFormspree();
            }
        }

        function handleNoClick() {
            noClickCounts[currentStep]++; 
            changeWarningBubble();
            
            const step = activeSteps[currentStep];
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            if (step.type === "shrink") { 
                yesScale += 0.3; yesBtn.style.transform = `scale(${yesScale})`; 
                noScale -= 0.2; noBtn.style.transform = `scale(${noScale})`; 
            }
            else if (step.type === "fade") noBtn.style.opacity = '0';
            else if (step.type === "fullscreen") yesBtn.classList.add('fullscreen-active');
            else if (step.type === "magnet") { 
                noBtn.style.opacity = '0';
                yesBtn.style.transform = 'scale(1.5)';
                setTimeout(() => nextStep(true), 300);
            }
        }

        function dodgeButton(e) {
            if (e) e.preventDefault();
            noClickCounts[currentStep]++; 
            changeWarningBubble();
            
            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = 'fixed';
            noBtn.style.zIndex = '1000';

            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        document.getElementById('noBtn').onclick = (e) => {
            if (activeSteps[currentStep].type === "run") {
                dodgeButton(e);
            } else {
                handleNoClick();
            }
        };

        function updateCard() {
            const s = activeSteps[currentStep];
            const noBtn = document.getElementById('noBtn');

            document.getElementById('questionText').innerText = s.question;
            document.getElementById('yesBtn').innerText = s.yes; 
            noBtn.innerText = s.no;
            document.getElementById('statusGif').src = s.gif;
            
            document.getElementById('yesBtn').style.transform = "scale(1)"; 
            noScale = 1; 
            noBtn.style.transform = "scale(1)"; 
            noBtn.style.opacity = "1"; 
            noBtn.style.position = 'static';
            noBtn.style.left = 'auto';
            noBtn.style.top = 'auto';
            
            noBtn.onmouseover = null;
            noBtn.ontouchstart = null;

            if (s.type === "run") {
                noBtn.onmouseover = dodgeButton;
                noBtn.ontouchstart = dodgeButton;
            }
        }

        function sendAnswersToFormspree() {
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('sendingStatus').style.display = 'block';

            if (!FORMSPREE_URL) {
                setTimeout(() => showResult(), 600);
                return;
            }

            let formData = {};
            userAnswers.forEach((item, index) => {
                formData[`မေးခွန်း ${index + 1}: ${item.q}`] = `${item.a} (ငြင်းခဲ့သည့်အကြိမ်ရေ: ${item.noCount} ကြိမ်)`;
            });

            fetch(FORMSPREE_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Accept": "application/json" },
                body: JSON.stringify(formData)
            })
            .then(() => showResult())
            .catch(() => showResult());
        }

        function showResult() {
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
            document.getElementById('summaryList').innerHTML = userAnswers.map((item, i) => 
                `<div class="result-item">
                    <div class="result-row">
                        <span class="result-q">${i+1}. ${item.q}</span>
                        <span class="result-a">${item.a}</span>
                    </div>
                    <div class="result-no-count">❌ ငြင်းခဲ့သည့်အကြိမ်ရေ: ${item.noCount} ကြိမ်</div>
                </div>`
            ).join('');
        }

        function saveToPNG() {
            html2canvas(document.getElementById('captureArea')).then(canvas => {
                let link = document.createElement('a');
                link.download = 'Our_Love_Agreement.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        // Background floating hearts
        setInterval(() => {
            let h = document.createElement('div');
            h.className = 'bg-heart';
            h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            document.getElementById('heartsContainer').appendChild(h);
            setTimeout(() => h.remove(), 6000);
        }, 800);

        // Initial setup on load
        renderEditorSteps();
    </script>
</body>
</html>
